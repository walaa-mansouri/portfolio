<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walaa Mansouri — Web Developer, Paris</title>
  <link rel="canonical" href="https://walaamansouri.com/en/">
  <link rel="alternate" hreflang="en" href="https://walaamansouri.com/en/" />
  <link rel="alternate" hreflang="fr" href="https://walaamansouri.com/fr/" />
  <link rel="alternate" hreflang="ar" href="https://walaamansouri.com/ar/" />
  <link rel="alternate" hreflang="x-default" href="https://walaamansouri.com/en/" />
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="icon" href="/img/logo.png" type="image/png" sizes="any">
  <!-- Fallback for crawlers/browsers with JS disabled: goes straight to English -->
  <meta http-equiv="refresh" content="0; url=/en/">
  <script>
    (function () {
      var supported = ['en', 'fr', 'ar'];
      var stored = null;
      try { stored = localStorage.getItem('wm_lang'); } catch (e) { }

      var browserLang = (navigator.language || navigator.userLanguage || 'en').slice(0, 2);

      var lang = supported.indexOf(stored) !== -1
        ? stored
        : (supported.indexOf(browserLang) !== -1 ? browserLang : 'en');

      window.location.replace('/' + lang + '/');
    })();
  </script>
</head>

<body>
  <p>Redirecting… if you're not sent automatically, <a href="/en/">click here</a>.</p>
</body>

</html>

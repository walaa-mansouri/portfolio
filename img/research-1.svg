<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120f1c"/>
      <stop offset="100%" stop-color="#0a0910"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg1)"/>
  <rect width="480" height="300" fill="url(#glow1)"/>
  <!-- binary backdrop -->
  <g font-family="monospace" font-size="11" fill="#ffffff" opacity="0.07">
    <text x="24" y="30">01001 11010 00110 10111 01001</text>
    <text x="24" y="50">10110 01101 11000 01011 10010</text>
    <text x="24" y="70">00111 10101 01100 11001 00110</text>
    <text x="24" y="250">11010 00101 10011 01110 10001</text>
    <text x="24" y="270">01100 11010 00111 10110 01011</text>
  </g>
  <!-- padlock -->
  <g transform="translate(160,90)">
    <rect x="0" y="46" width="120" height="90" rx="14" fill="#171325" stroke="url(#grad1)" stroke-width="2.5"/>
    <path d="M20 46 V28 a40 40 0 0 1 80 0 V46" fill="none" stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="60" cy="86" r="11" fill="url(#grad1)"/>
    <rect x="55" y="90" width="10" height="26" rx="4" fill="url(#grad1)"/>
  </g>
  <!-- key -->
  <g transform="translate(300,150) rotate(-25)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#grad1)" stroke-width="7"/>
    <rect x="20" y="-5" width="70" height="10" rx="4" fill="url(#grad1)"/>
    <rect x="72" y="5" width="10" height="16" fill="url(#grad1)"/>
    <rect x="88" y="5" width="10" height="20" fill="url(#grad1)"/>
  </g>
  <text x="240" y="270" text-anchor="middle" font-family="monospace" font-size="13" fill="#c4b5fd" opacity="0.85">N = p · q</text>
</svg>
